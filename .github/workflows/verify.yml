name: Verify Atlas

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m unittest discover -s tests -v
      - run: |
          python3 atlas.py build --output dist/single
          python3 atlas.py build --site examples/site.json --output dist/combined
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
