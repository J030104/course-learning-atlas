<!doctype html>
<html lang="zh-Hant">
<head><!-- atlas-version -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>課程學習圖鑑 · PDF 閱讀器</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#edf2ee;color:#183e3a;font:15px/1.5 system-ui,sans-serif}
header{flex:none;display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem;background:#fffefb;border-bottom:1px solid #c8d9d0}
button,input,a{font:inherit;color:inherit}button,input{padding:.25rem .55rem;border:1px solid #adc3b7;border-radius:5px;background:white}
button:disabled{opacity:.5}input{width:5em}a{font-weight:650}main{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain;scrollbar-gutter:stable}
#pages{display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:.8rem;min-width:100%}
.pdf-page{position:relative;flex:none;background:white;box-shadow:0 1px 7px #183e3a29}
.pdf-page p{position:absolute;inset:0;display:grid;place-content:center;margin:0;color:#536e66;text-align:center}
canvas{display:block;width:100%;height:100%}#status{text-align:center;margin:.4rem}
[hidden]{display:none!important}.atlas-update{background:#fff0cf;padding:.25rem .5rem;border-radius:.4rem}
</style>
</head>
<body>
<header aria-label="PDF 操作">
 <a id="atlas" href="./" target="_top">學習圖譜</a>
 <button id="previous" type="button" aria-label="上一頁" disabled>↑</button>
 <form id="page-form"><label>頁 <input id="page-number" type="number" min="1" value="1" required disabled></label> / <span id="total">–</span></form>
 <button id="next" type="button" aria-label="下一頁" disabled>↓</button>
 <button id="smaller" type="button" aria-label="縮小" disabled>−</button>
 <button id="fit" type="button" disabled>符合寬度</button>
 <button id="larger" type="button" aria-label="放大" disabled>+</button>
 <a id="original" target="_blank" rel="noopener" hidden>原始 PDF ↗</a>
<span class="atlas-update" data-update-notice hidden><span role="status">此頁有新版本</span> <button type="button">重新整理</button></span></header>
<p id="status" role="status">正在載入 PDF…</p>
<main id="scroll" tabindex="0" aria-label="文件頁面，連續上下捲動"><div id="pages"></div></main>
<script type="module" src="pdf-viewer.mjs"></script>
<script type="module" src="components/version-monitor.mjs"></script>
</body>
</html>
